170" r="6.5" fill="#ffffff" stroke="#1a7f37" stroke-width="3.5"/><text x="765" y="152" font-size="12" text-anchor="middle" fill="#1f2328">4 admission policies</text><circle cx="100" cy="110" r="6.5" fill="#ffffff" stroke="#bf8700" stroke-width="3.5"/><text x="100" y="92" font-size="12" text-anchor="middle" fill="#1f2328">app commit</text><circle cx="200" cy="110" r="6.5" fill="#ffffff" stroke="#bf8700" stroke-width="3.5"/><text x="200" y="92" font-size="12" text-anchor="middle" fill="#1f2328">Trivy gate</text><circle cx="300" cy="110" r="6.5" fill="#ffffff" stroke="#bf8700" stroke-width="3.5"/><text x="300" y="92" font-size="12" text-anchor="middle" fill="#1f2328">tag + digest</text><circle cx="732" cy="250" r="6.5" fill="#ffffff" stroke="#bf8700" stroke-width="3.5"/><text x="732" y="276" font-size="12" text-anchor="middle" fill="#1f2328">dev · first service</text><circle cx="800" cy="250" r="6.5" fill="#ffffff" stroke="#bf8700" stroke-width="3.5"/><text x="800" y="294" font-size="12" text-anchor="middle" fill="#1f2328">prod · pending</text><circle cx="880" cy="300" r="6.5" fill="#ffffff" stroke="#8250df" stroke-width="3.5"/><text x="896" y="304" font-size="12" text-anchor="start" fill="#1f2328">firing alerts</text><circle cx="760" cy="360" r="6.5" fill="#ffffff" stroke="#8250df" stroke-width="3.5"/><text x="760" y="386" font-size="12" text-anchor="middle" fill="#1f2328">agent · 0 write credentials</text><circle cx="600" cy="360" r="6.5" fill="#ffffff" stroke="#8250df" stroke-width="3.5"/><text x="600" y="386" font-size="12" text-anchor="middle" fill="#1f2328">report names its runbooks</text><circle cx="440" cy="360" r="6.5" fill="#ffffff" stroke="#8250df" stroke-width="3.5"/><text x="440" y="386" font-size="12" text-anchor="middle" fill="#1f2328">issue for human review</text><circle cx="100" cy="440" r="6.5" fill="#ffffff" stroke="#bf3989" stroke-width="3.5"/><text x="100" y="466" font-size="12" text-anchor="middle" fill="#1f2328">priced before it's built</text><circle cx="300" cy="440" r="6.5" fill="#ffffff" stroke="#bf3989" stroke-width="3.5"/><text x="300" y="466" font-size="12" text-anchor="middle" fill="#1f2328">Terraform · 75 resources</text><circle cx="500" cy="440" r="6.5" fill="#ffffff" stroke="#bf3989" stroke-width="3.5"/><text x="500" y="466" font-size="12" text-anchor="middle" fill="#1f2328">write-only escrow · 6/6 probes</text><circle cx="700" cy="440" r="6.5" fill="#ffffff" stroke="#bf3989" stroke-width="3.5"/><text x="700" y="466" font-size="12" text-anchor="middle" fill="#1f2328">4 deployed · 0 accepted yet</text><circle cx="880" cy="440" r="6.5" fill="#ffffff" stroke="#bf3989" stroke-width="3.5"/><text x="874" y="466" font-size="12" text-anchor="middle" fill="#1f2328">$0.00 · Sep 2026 bill</text><rect x="359" y="159" width="22" height="36" rx="11" fill="#ffffff" stroke="#1f2328" stroke-width="4"/><text x="370" y="216" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">7 checks</text><rect x="629" y="159" width="22" height="36" rx="11" fill="#ffffff" stroke="#1f2328" stroke-width="4"/><text x="636" y="216" font-size="13" font-weight="700" text-anchor="end" fill="#1f2328">Argo CD · 19 apps</text><rect x="869" y="159" width="22" height="22" rx="11" fill="#ffffff" stroke="#1f2328" stroke-width="4"/><text x="862" y="204" font-size="13" font-weight="700" text-anchor="end" fill="#1f2328">k3s · 17 self-heal</text><g opacity="0"><set attributeName="opacity" to="1" begin="0.0s"/><circle r="5" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><circle r="2.2" fill="#1f2328"/><animateMotion dur="17.8s" begin="0.0s" repeatCount="indefinite" path="M80 170 L880 170" keyPoints="0;1;1;0;0" keyTimes="0;.45;.5;.95;1" calcMode="linear"/></g><g opacity="0"><set attributeName="opacity" to="1" begin="0.7s"/><circle r="5" fill="#ffffff" stroke="#bf8700" stroke-width="2"/><circle r="2.2" fill="#1f2328"/><animateMotion dur="15.3s" begin="0.7s" repeatCount="indefinite" path="M100 110 L310 110 L370 170 L384 184 L654 184